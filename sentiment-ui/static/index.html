<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Sentiment Analysis — Tunisian</title>
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link href="https://fonts.googleapis.com/css2?family=IBM+Plex+Mono:wght@400;600&family=IBM+Plex+Sans+Arabic:wght@300;400;600&display=swap" rel="stylesheet">
    <style>
        :root {
            --bg: #0d0d0d;
            --surface: #161616;
            --surface2: #1f1f1f;
            --border: #2a2a2a;
            --accent: #00e5a0;
            --accent-dim: rgba(0,229,160,0.12);
            --text: #e8e8e8;
            --muted: #666;
            --pos: #00e5a0;
            --neg: #ff4f6a;
            --neu: #7b8cff;
            --font-mono: 'IBM Plex Mono', monospace;
            --font-body: 'IBM Plex Sans Arabic', sans-serif;
        }

        *, *::before, *::after { box-sizing: border-box; margin: 0; padding: 0; }

        body {
            font-family: var(--font-body);
            background: var(--bg);
            color: var(--text);
            min-height: 100vh;
            padding: 2rem 1rem 4rem;
            display: flex;
            flex-direction: column;
            align-items: center;
        }

        /* Grid noise background */
        body::before {
            content: '';
            position: fixed;
            inset: 0;
            background-image:
                linear-gradient(rgba(0,229,160,0.03) 1px, transparent 1px),
                linear-gradient(90deg, rgba(0,229,160,0.03) 1px, transparent 1px);
            background-size: 40px 40px;
            pointer-events: none;
            z-index: 0;
        }

        .wrap {
            position: relative;
            z-index: 1;
            width: 100%;
            max-width: 640px;
        }

        header {
            margin-bottom: 2.5rem;
            padding-top: 1rem;
        }

        .logo-row {
            display: flex;
            align-items: center;
            gap: 0.75rem;
            margin-bottom: 0.4rem;
        }

        .logo-dot {
            width: 10px;
            height: 10px;
            border-radius: 50%;
            background: var(--accent);
            box-shadow: 0 0 12px var(--accent);
            animation: pulse 2s ease-in-out infinite;
        }

        @keyframes pulse {
            0%, 100% { opacity: 1; transform: scale(1); }
            50% { opacity: 0.5; transform: scale(0.7); }
        }

        h1 {
            font-family: var(--font-mono);
            font-size: 1.1rem;
            font-weight: 600;
            letter-spacing: 0.08em;
            text-transform: uppercase;
            color: var(--accent);
        }

        .subtitle {
            font-size: 0.8rem;
            color: var(--muted);
            font-family: var(--font-mono);
            letter-spacing: 0.05em;
        }

        /* Mode toggle */
        .mode-toggle {
            display: flex;
            background: var(--surface);
            border: 1px solid var(--border);
            border-radius: 6px;
            padding: 3px;
            margin-bottom: 1.25rem;
            gap: 3px;
        }

        .mode-toggle input[type="radio"] { display: none; }

        .mode-toggle label {
            flex: 1;
            text-align: center;
            padding: 0.5rem 0;
            font-family: var(--font-mono);
            font-size: 0.75rem;
            font-weight: 600;
            letter-spacing: 0.06em;
            text-transform: uppercase;
            color: var(--muted);
            cursor: pointer;
            border-radius: 4px;
            transition: all 0.2s;
        }

        .mode-toggle input[type="radio"]:checked + label {
            background: var(--accent-dim);
            color: var(--accent);
            border: 1px solid rgba(0,229,160,0.3);
        }

        /* Input area */
        .input-card {
            background: var(--surface);
            border: 1px solid var(--border);
            border-radius: 8px;
            margin-bottom: 1rem;
            overflow: hidden;
            transition: border-color 0.2s;
        }

        .input-card:focus-within {
            border-color: rgba(0,229,160,0.4);
        }

        textarea {
            width: 100%;
            min-height: 130px;
            background: transparent;
            color: var(--text);
            border: none;
            outline: none;
            padding: 1rem;
            font-size: 1rem;
            font-family: var(--font-body);
            resize: vertical;
            line-height: 1.6;
        }

        textarea::placeholder { color: var(--muted); }

        .input-footer {
            display: flex;
            justify-content: space-between;
            align-items: center;
            padding: 0.5rem 1rem;
            border-top: 1px solid var(--border);
        }

        #char-count {
            font-family: var(--font-mono);
            font-size: 0.7rem;
            color: var(--muted);
        }

        /* Submit button */
        .submit-btn {
            width: 100%;
            padding: 0.875rem;
            font-family: var(--font-mono);
            font-size: 0.85rem;
            font-weight: 600;
            letter-spacing: 0.1em;
            text-transform: uppercase;
            background: var(--accent-dim);
            color: var(--accent);
            border: 1px solid rgba(0,229,160,0.35);
            border-radius: 6px;
            cursor: pointer;
            transition: all 0.2s;
            display: flex;
            justify-content: center;
            align-items: center;
            gap: 0.6rem;
            margin-bottom: 1.5rem;
        }

        .submit-btn:hover:not(:disabled) {
            background: rgba(0,229,160,0.2);
            box-shadow: 0 0 20px rgba(0,229,160,0.15);
        }

        .submit-btn:disabled {
            opacity: 0.4;
            cursor: not-allowed;
        }

        .spinner {
            width: 16px;
            height: 16px;
            border: 2px solid rgba(0,229,160,0.3);
            border-top-color: var(--accent);
            border-radius: 50%;
            animation: spin 0.7s linear infinite;
        }

        @keyframes spin {
            to { transform: rotate(360deg); }
        }

        /* Results */
        #results {
            display: none;
            animation: fadeUp 0.35s ease;
        }

        @keyframes fadeUp {
            from { opacity: 0; transform: translateY(12px); }
            to   { opacity: 1; transform: translateY(0); }
        }

        .result-header {
            display: flex;
            align-items: center;
            gap: 1rem;
            margin-bottom: 1.25rem;
        }

        .sentiment-badge {
            font-family: var(--font-mono);
            font-size: 0.75rem;
            font-weight: 600;
            letter-spacing: 0.1em;
            text-transform: uppercase;
            padding: 0.3rem 0.75rem;
            border-radius: 4px;
        }

        .sentiment-badge.positive { background: rgba(0,229,160,0.15); color: var(--pos); border: 1px solid rgba(0,229,160,0.3); }
        .sentiment-badge.negative { background: rgba(255,79,106,0.15); color: var(--neg); border: 1px solid rgba(255,79,106,0.3); }
        .sentiment-badge.neutral  { background: rgba(123,140,255,0.15); color: var(--neu); border: 1px solid rgba(123,140,255,0.3); }

        .confidence {
            font-family: var(--font-mono);
            font-size: 0.85rem;
            color: var(--muted);
        }

        .confidence span {
            color: var(--text);
            font-weight: 600;
        }

        /* Score bars */
        .scores-section {
            background: var(--surface);
            border: 1px solid var(--border);
            border-radius: 8px;
            padding: 1rem 1.25rem;
            margin-bottom: 1rem;
        }

        .score-row {
            margin-bottom: 0.85rem;
        }

        .score-row:last-child { margin-bottom: 0; }

        .score-meta {
            display: flex;
            justify-content: space-between;
            margin-bottom: 0.35rem;
        }

        .score-label {
            font-family: var(--font-mono);
            font-size: 0.75rem;
            text-transform: uppercase;
            letter-spacing: 0.06em;
            color: var(--muted);
        }

        .score-value {
            font-family: var(--font-mono);
            font-size: 0.75rem;
            font-weight: 600;
        }

        .score-track {
            height: 6px;
            background: var(--surface2);
            border-radius: 3px;
            overflow: hidden;
        }

        .score-fill {
            height: 100%;
            border-radius: 3px;
            transition: width 0.6s cubic-bezier(0.4, 0, 0.2, 1);
        }

        .score-fill.positive { background: var(--pos); }
        .score-fill.negative { background: var(--neg); }
        .score-fill.neutral  { background: var(--neu); }

        /* Opinion card */
        #opinion-card {
            display: none;
            background: var(--surface);
            border: 1px solid var(--border);
            border-left: 3px solid var(--accent);
            border-radius: 8px;
            padding: 1.25rem;
            margin-bottom: 1rem;
        }

        .opinion-tag {
            font-family: var(--font-mono);
            font-size: 0.65rem;
            letter-spacing: 0.1em;
            text-transform: uppercase;
            color: var(--accent);
            margin-bottom: 0.75rem;
            opacity: 0.7;
        }

        #opinion-text {
            font-size: 0.95rem;
            line-height: 1.7;
            color: var(--text);
        }

        /* Error banner */
        #error-banner {
            display: none;
            position: fixed;
            top: 1.25rem;
            left: 50%;
            transform: translateX(-50%);
            background: rgba(255,79,106,0.15);
            color: var(--neg);
            border: 1px solid rgba(255,79,106,0.35);
            padding: 0.75rem 1.5rem;
            border-radius: 6px;
            font-family: var(--font-mono);
            font-size: 0.8rem;
            z-index: 100;
            backdrop-filter: blur(8px);
            white-space: nowrap;
        }

        /* Config row */
        .config-row {
            display: flex;
            align-items: center;
            gap: 0.5rem;
            padding: 0 0 0.15rem;
        }

        .config-row label {
            font-family: var(--font-mono);
            font-size: 0.7rem;
            color: var(--muted);
            white-space: nowrap;
        }

        .config-row input[type="text"] {
            flex: 1;
            background: transparent;
            border: none;
            outline: none;
            font-family: var(--font-mono);
            font-size: 0.7rem;
            color: var(--muted);
            text-align: right;
        }
    </style>
</head>
<body>
<div class="wrap">

    <header>
        <div class="logo-row">
            <div class="logo-dot"></div>
            <h1>Sentiment Analysis</h1>
        </div>
        <p class="subtitle">Tunisian Dialect · Arabizi · Arabic · Français</p>
    </header>

    <div class="mode-toggle">
        <input type="radio" id="mode-test" name="mode" value="predict" checked>
        <label for="mode-test">Test</label>
        <input type="radio" id="mode-generate" name="mode" value="generate">
        <label for="mode-generate">Generate Opinion</label>
    </div>

    <div class="input-card">
        <textarea id="text-input" dir="auto" placeholder="اكتب نصًا... ou écris en Arabizi..."></textarea>
        <div class="input-footer">
            <div class="config-row">
                <label for="api-url">API:</label>
                <input type="text" id="api-url" value="http://localhost:8000" placeholder="http://your-vm-ip:8000">
            </div>
            <span id="char-count">0 chars</span>
        </div>
    </div>

    <button id="submit-btn" class="submit-btn">
        <span class="btn-text">Analyse</span>
    </button>

    <div id="results">
        <div class="result-header">
            <span id="sentiment-label" class="sentiment-badge"></span>
            <span class="confidence">Confidence: <span id="confidence-score"></span></span>
        </div>

        <div class="scores-section" id="scores-container"></div>

        <div id="opinion-card">
            <div class="opinion-tag">// generated opinion</div>
            <p id="opinion-text"></p>
        </div>
    </div>

</div>

<div id="error-banner"></div>

<script>
document.addEventListener('DOMContentLoaded', () => {
    const textInput     = document.getElementById('text-input');
    const submitBtn     = document.getElementById('submit-btn');
    const btnText       = submitBtn.querySelector('.btn-text');
    const results       = document.getElementById('results');
    const sentimentLabel = document.getElementById('sentiment-label');
    const confidenceEl  = document.getElementById('confidence-score');
    const scoresContainer = document.getElementById('scores-container');
    const opinionCard   = document.getElementById('opinion-card');
    const opinionText   = document.getElementById('opinion-text');
    const errorBanner   = document.getElementById('error-banner');
    const charCount     = document.getElementById('char-count');
    const apiUrlInput   = document.getElementById('api-url');

    // Char counter
    textInput.addEventListener('input', () => {
        charCount.textContent = `${textInput.value.length} chars`;
    });

    submitBtn.addEventListener('click', async () => {
        const text = textInput.value.trim();
        if (!text) return;

        const mode     = document.querySelector('input[name="mode"]:checked').value;
        const baseUrl  = (apiUrlInput.value || 'http://localhost:8000').replace(/\/$/, '');
        const endpoint = `${baseUrl}/${mode}`;

        setLoading(true);
        results.style.display = 'none';

        try {
            const response = await fetch(endpoint, {
                method: 'POST',
                headers: { 'Content-Type': 'application/json' },
                body: JSON.stringify({ text })
            });

            if (!response.ok) {
                const err = await response.json().catch(() => ({}));
                throw new Error(err.detail || `HTTP ${response.status}`);
            }

            const data = await response.json();
            displayResults(data, mode);

        } catch (err) {
            console.error(err);
            showError(`Error: ${err.message}`);
        } finally {
            setLoading(false);
        }
    });

    // ─── Display ──────────────────────────────────────────────────────────────
    function displayResults(data, mode) {
        results.style.display = 'block';

        // ── Sentiment label + confidence ──────────────────────────────────────
        // API returns flat: { label, confidence, scores: { negative, neutral, positive } }
        // OR nested:        { sentiment: { label, confidence }, scores: [...] }
        // We handle both shapes.

        let label, confidence, scores;

        if (data.label !== undefined) {
            // Flat shape (your current API)
            label      = data.label;
            confidence = data.confidence;   // already a percentage (e.g. 99.15)
            scores     = data.scores;       // object { negative, neutral, positive }
        } else if (data.sentiment) {
            // Nested shape
            label      = data.sentiment.label;
            confidence = data.sentiment.confidence * 100;
            scores     = data.scores;
        }

        // Badge
        const lc = (label || '').toLowerCase();
        sentimentLabel.textContent = label || '—';
        sentimentLabel.className   = `sentiment-badge ${lc}`;

        // Confidence
        confidenceEl.textContent = `${parseFloat(confidence).toFixed(2)}%`;

        // ── Score bars ────────────────────────────────────────────────────────
        scoresContainer.innerHTML = '';

        if (scores) {
            let scoreEntries = [];

            if (Array.isArray(scores)) {
                // Array shape [{ label, score }]
                scoreEntries = scores.map(s => ({
                    label: s.label,
                    value: s.score > 1 ? s.score : s.score * 100   // normalise
                }));
            } else if (typeof scores === 'object') {
                // Object shape { negative: 0.17, neutral: 0.67, positive: 99.15 }
                scoreEntries = Object.entries(scores).map(([k, v]) => ({
                    label: k,
                    value: parseFloat(v)
                }));
            }

            scoreEntries.forEach(({ label: sl, value }) => {
                const pct = parseFloat(value).toFixed(2);
                const colorClass = sl.toLowerCase();
                scoresContainer.insertAdjacentHTML('beforeend', `
                    <div class="score-row">
                        <div class="score-meta">
                            <span class="score-label">${sl}</span>
                            <span class="score-value" style="color: var(--${colorClass === 'positive' ? 'pos' : colorClass === 'negative' ? 'neg' : 'neu'})">${pct}%</span>
                        </div>
                        <div class="score-track">
                            <div class="score-fill ${colorClass}" style="width: ${Math.min(pct,100)}%"></div>
                        </div>
                    </div>
                `);
            });
        }

        // ── Opinion ───────────────────────────────────────────────────────────
        if (mode === 'generate' && data.opinion) {
            opinionText.textContent = data.opinion;
            opinionCard.style.display = 'block';
        } else {
            opinionCard.style.display = 'none';
        }
    }

    // ─── Helpers ───────────────────────────────────────────────────────────────
    function setLoading(on) {
        submitBtn.disabled = on;
        btnText.textContent = on ? '' : 'Analyse';
        const existing = submitBtn.querySelector('.spinner');
        if (on && !existing) {
            const sp = document.createElement('div');
            sp.className = 'spinner';
            submitBtn.insertBefore(sp, btnText);
        } else if (!on && existing) {
            existing.remove();
        }
    }

    function showError(msg) {
        errorBanner.textContent = msg;
        errorBanner.style.display = 'block';
        setTimeout(() => { errorBanner.style.display = 'none'; }, 5000);
    }
});
</script>
</body>
</html>
